<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Student Sign Up</title>
</head>
<body>
        <h1>STUDENT REGISTRATION</h1>
        <p>Please fill out the form below to register for the student learning portal.</p>
        
        <hr>
        
        <form action="">
            <p>
                <label for="name">Name:</label>
                <input type="text" placeholder="Enter your name" name="name" required>
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" placeholder="Enter your email" name="email" required>
            </p>
            <p>
                <label for="password">Password:</label>
                <input type="password" placeholder="Create your password" name="password" required>
            </p>
            <p>
                <label for="course">Select Course:</label>

                    <select name="course" id="course" required>
                        <option value="">--Choose a course--</option>
                        <option value="computer-science">HTML</option>
                        <option value="mathematics">CSS</option>
                        <option value="physics">JAVASCRIPT</option>
                    </select>
            </p>
            <p>
                <input type="submit" value="Register" >
            </p>
            <textarea name="Feedback" id="" placeholder="Please give your feedback..." rows="5"></textarea>
        </form>
        <br>
        <hr>
        <br>

        <a href="project2.html">Back to Home Page</a>
</body>
</html>
